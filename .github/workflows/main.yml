name: Build Kinemium Engine
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: windows
            folder: windows_x86-64
          - os: macos-latest
            flag: macos
            folder: macos_x86-64
          - os: ubuntu-latest
            flag: debian
            folder: debian_x86-64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install tools
        run: rokit install --no-trust-check

      - name: Create sandboxed embed dir
        shell: bash
        run: mkdir -p build/.embedded/src/sandboxed

      - name: Install CMake and Ninja
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build build-essential libc++1 libc++abi1 libc++-dev libc++abi-dev
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install cmake ninja
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            choco install cmake ninja -y
          fi

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxrender-dev libxss-dev \
            libxtst-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libibus-1.0-dev \
            libgtk-3-dev \
            libfontconfig1-dev

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.304.1
          install_runtime: true
          cache: true
          stripdown: false

      - name: Setup MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S external -B external/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build native dependencies
        shell: bash
        run: |
          cmake --build external/build --config Release --parallel

      - name: Stage native runtime library
        shell: bash
        run: |
          mkdir -p vendor

          case "${{ matrix.os }}" in
            ubuntu-latest)
              src="external/build/bin/KinemiumLibs.so"
              fallback="external/build/bin/libKinemiumLibs.so"
              dest="vendor/KinemiumLibs.so"
              ;;
            macos-latest)
              src="external/build/bin/KinemiumLibs.dylib"
              fallback="external/build/bin/libKinemiumLibs.dylib"
              dest="vendor/KinemiumLibs.dylib"
              ;;
            windows-latest)
              src="external/build/bin/KinemiumLibs.dll"
              fallback="external/build/bin/libKinemiumLibs.dll"
              dest="vendor/KinemiumLibs.dll"
              ;;
          esac

          if [[ ! -f "$src" && -f "$fallback" ]]; then
            src="$fallback"
          fi

          if [[ ! -f "$src" ]]; then
            echo "Native runtime library was not produced."
            find external/build/bin -maxdepth 1 -type f -print || true
            exit 1
          fi

          cp "$src" "$dest"
          ls -lh "$dest"

      - name: Verify native runtime dependencies
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)
              ldd -r vendor/KinemiumLibs.so
              readelf -W -l vendor/KinemiumLibs.so | grep GNU_STACK
              if readelf -W -l vendor/KinemiumLibs.so | grep GNU_STACK | grep -q 'RWE'; then
                echo "KinemiumLibs.so was linked with an executable GNU_STACK segment."
                exit 1
              fi
              if ldd -r vendor/KinemiumLibs.so 2>&1 | grep -q "undefined symbol"; then
                echo "KinemiumLibs.so has unresolved symbols."
                exit 1
              fi
              ;;
            macos-latest)
              otool -L vendor/KinemiumLibs.dylib
              if otool -L vendor/KinemiumLibs.dylib | grep -E "external/build|_deps|not found"; then
                echo "KinemiumLibs.dylib has non-portable or missing install-name dependencies."
                exit 1
              fi
              ;;
            windows-latest)
              dumpbin //dependents vendor/KinemiumLibs.dll || true
              ;;
          esac

      - name: Run engine to gather libraries
        run: zune run engine --cli

      - name: Restage native runtime library
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)
              src="external/build/bin/KinemiumLibs.so"
              fallback="external/build/bin/libKinemiumLibs.so"
              dest="vendor/KinemiumLibs.so"
              ;;
            macos-latest)
              src="external/build/bin/KinemiumLibs.dylib"
              fallback="external/build/bin/libKinemiumLibs.dylib"
              dest="vendor/KinemiumLibs.dylib"
              ;;
            windows-latest)
              src="external/build/bin/KinemiumLibs.dll"
              fallback="external/build/bin/libKinemiumLibs.dll"
              dest="vendor/KinemiumLibs.dll"
              ;;
          esac

          if [[ ! -f "$src" && -f "$fallback" ]]; then
            src="$fallback"
          fi

          cp "$src" "$dest"

      - name: Build engine
        run: zune run build --${{ matrix.flag }}

      - name: Verify packaged native runtime library
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)
              test -f "build/${{ matrix.folder }}/KinemiumLibs.so"
              ldd -r "build/${{ matrix.folder }}/KinemiumLibs.so"
              readelf -W -l "build/${{ matrix.folder }}/KinemiumLibs.so" | grep GNU_STACK
              if readelf -W -l "build/${{ matrix.folder }}/KinemiumLibs.so" | grep GNU_STACK | grep -q 'RWE'; then
                echo "Packaged KinemiumLibs.so was linked with an executable GNU_STACK segment."
                exit 1
              fi
              ;;
            macos-latest)
              test -f "build/${{ matrix.folder }}/KinemiumLibs.dylib"
              otool -L "build/${{ matrix.folder }}/KinemiumLibs.dylib"
              if otool -L "build/${{ matrix.folder }}/KinemiumLibs.dylib" | grep -E "external/build|_deps|not found"; then
                echo "Packaged KinemiumLibs.dylib has non-portable or missing install-name dependencies."
                exit 1
              fi
              ;;
            windows-latest)
              test -f "build/${{ matrix.folder }}/KinemiumLibs.dll"
              ;;
          esac

      - name: Remove .embedded folder
        shell: bash
        run: rm -rf build/${{ matrix.folder }}/.embedded

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.folder }}
          path: build/${{ matrix.folder }}
